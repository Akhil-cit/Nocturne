appId: com.nocturne.app
productName: Nocturne
copyright: Copyright © 2024 Nocturne

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
